<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fate — a workspace your coding agent already knows how to use</title>
    <meta
      name="description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key. Join the waitlist."
    />
    <meta name="color-scheme" content="dark" />
    <!-- Matches --color-ink in src/index.css, so Android Chrome's toolbar and
         the iOS status bar do not sit as a light strip above a black page. -->
    <meta name="theme-color" content="#08080a" />

    <!-- A waitlist link exists to be pasted somewhere. Without these it previews
         as a bare URL, which is the one context where this page gets judged
         before it is ever opened. Canonical is absolute because the same build
         answers on the custom domain and on the pages.dev deployment URLs.

         WHY www AND NOT THE BARE DOMAIN: Wix registered this domain and will
         not let its nameservers move, so the apex cannot reach Cloudflare Pages
         and serves Wix's 404. Only www can be pointed here, by CNAME. Naming
         the apex canonical would aim every search result and share preview at
         a dead page. Change both of these back to the apex the day the domain
         leaves Wix - see the blocker at the top of docs/DEPLOY.md. -->
    <link rel="canonical" href="https://www.divineconstruc.com/" />
    <meta property="og:type" content="website" />
    <!-- "Construc", no T: BRAND.studio in src/content.ts is spelled that way on
         purpose - it matches the domain and it is how Nathan writes it. This
         tag said "Construct" and was the only place on the site that did. -->
    <meta property="og:site_name" content="Divine Construc" />
    <meta property="og:url" content="https://www.divineconstruc.com/" />
    <meta property="og:title" content="Fate — a workspace your coding agent already knows how to use" />
    <meta
      property="og:description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key."
    />
    <!-- og:image was deliberately absent while there was nothing real to point
         at — a card with no image renders as text, a card pointing at a 404
         renders as broken. There is now a real card at /og.png, built by
         art-src/og-card.py from the mark and HERO.headline.

         ABSOLUTE, not root-relative. og:image is the one URL in this head that
         several scrapers will not resolve against the document; Facebook's and
         iMessage's both want it fully qualified. Same host as canonical, for
         the www reason above.

         The dimensions are declared because X and Discord lay the card out
         before the image finishes downloading; without them a 1200x630 lands
         in a square slot and gets cropped to the wordmark. -->
    <meta property="og:image" content="https://www.divineconstruc.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fate, over a six-fingered hand: a workspace your coding agent already knows how to use."
    />

    <!-- summary_large_image, not summary: the card is 1.91:1 and summary crops
         it to a square thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fate — a workspace your coding agent already knows how to use" />
    <meta
      name="twitter:description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key."
    />
    <meta name="twitter:image" content="https://www.divineconstruc.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="Fate, over a six-fingered hand: a workspace your coding agent already knows how to use."
    />

    <!-- THE ICONS ARE REAL FILES NOW, and that is the fix rather than a
         detail of it. This was a single `rel="icon"` holding an inline
         data:image/svg+xml URI: no request, no binary asset, and invisible to
         every consumer that does not run the page. ChatGPT, Discord, Slack and
         iMessage read the markup and then GET a URL; several skip the markup
         and GET /favicon.ico blindly. A data: URI gives all of them nothing,
         which is why the link previewed with no Fate icon.

         The mark itself is unchanged — public/favicon.svg is that same
         six-fingered hand, and every raster below is rendered from it by
         art-src/icons.mjs. See the comment in the SVG for why it has six.

         🔴 THESE PATHS MUST RESOLVE, AND A 404 HERE DOES NOT LOOK LIKE ONE.
         Cloudflare Pages serves index.html with a 200 for any unmatched path,
         so a mistyped icon URL returns HTML that a browser silently discards
         and a crawler may cache as the icon. Verify with the content-type, not
         the status code:
           curl -sI https://www.divineconstruc.com/favicon.ico | grep -i type
         image/x-icon is right; text/html means the file is not deployed.

         Root-relative, never bare `favicon.ico`. The page is one route and the
         only other URL that gets shared is /#waitlist, whose fragment never
         reaches the server — but a relative path would still be the thing that
         broke first if this page ever moves off /. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- Preferred by every current browser: one vector for every tab size. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The PNG rungs exist for the scrapers, not the browsers. Some take
         neither ICO nor SVG and want a PNG they can thumbnail. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- iOS home screen. No `sizes`: 180 is the only one we ship and iOS
         downsamples it for the smaller slots. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

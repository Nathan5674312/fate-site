<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fate — a workspace your coding agent already knows how to use</title>
    <meta
      name="description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key. Join the waitlist."
    />
    <meta name="color-scheme" content="dark" />

    <!-- A waitlist link exists to be pasted somewhere. Without these it previews
         as a bare URL, which is the one context where this page gets judged
         before it is ever opened. Canonical is absolute because the same build
         answers on the custom domain and on the pages.dev deployment URLs.

         WHY www AND NOT THE BARE DOMAIN: Wix registered this domain and will
         not let its nameservers move, so the apex cannot reach Cloudflare Pages
         and serves Wix's 404. Only www can be pointed here, by CNAME. Naming
         the apex canonical would aim every search result and share preview at
         a dead page. Change both of these back to the apex the day the domain
         leaves Wix - see the blocker at the top of docs/DEPLOY.md. -->
    <link rel="canonical" href="https://www.divineconstruc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Divine Construct" />
    <meta property="og:url" content="https://www.divineconstruc.com/" />
    <meta property="og:title" content="Fate — a workspace your coding agent already knows how to use" />
    <meta
      property="og:description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key."
    />
    <!-- og:image is deliberately absent until there is a real screenshot to put
         in it. A card with a missing image renders as text; a card pointing at a
         404 renders as broken. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fate — a workspace your coding agent already knows how to use" />
    <meta
      name="twitter:description"
      content="Point Claude, Codex or Gemini at the folder. Plain markdown on disk, no plugin, no API key."
    />

    <!-- Inline SVG favicon: no binary asset, no extra request.

         IT IS A HAND WITH SIX FINGERS, and the sixth is the whole point. The
         site's payload is the one thing every practitioner has seen — that AI
         cannot draw hands — so the tab carries the tell itself rather than a
         monogram. DESIGN.md section 9 calls this the insider test: legible as a
         gag to the audience who has generated a malformed hand, and to everyone
         else just a hand, which is a stranger thing to find in a tab than a
         letter and is the reason to click it.

         Drawn for the sizes it is actually rendered at, not for the artboard.
         Six digits are countable from 32px up, which is what a Chrome tab
         rasterises on a 2x display; at a true 16px it holds as a splayed hand
         and nothing more, which is the correct thing to degrade to. One digit
         doglegs at the tip, because an unsettling hand is not a hand with a
         spare finger neatly attached.

         Palette is the SITE's, and that is the bug this replaces. It was a
         Cream letter F on warm Ink, with a comment claiming it inherited the
         app's palette. True when written; the site moved to neutral greys
         (index.css line 38 marks the ground "Neutral, not the app's warm Ink")
         and the favicon did not follow, so the one brown object on the page was
         the icon in the tab. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0e'/%3E%3Cg stroke='%23f4f4f5' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M15.5 25.5 L4.5 19.6'/%3E%3Cpath d='M15.5 25.5 L6.2 10.4'/%3E%3Cpath d='M15.5 25.5 L10.7 5.4'/%3E%3Cpath d='M15.5 25.5 L15.9 4.2'/%3E%3Cpath d='M15.5 25.5 L21.5 8.4 L19.3 5.0'/%3E%3Cpath d='M15.5 25.5 L26.6 12.2'/%3E%3C/g%3E%3Crect x='9.8' y='21.4' width='11.6' height='11' rx='4.2' fill='%23f4f4f5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
